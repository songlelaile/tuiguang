name: tuiguang

services:
  app:
    build:
      context: .
    image: tuiguang-app:latest
    container_name: tuiguang-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5174
      HOST: 0.0.0.0
      HUOPAN_UPLOAD_DIR: /app/uploads/source-data
      HUOPAN_DATA_DIR: /app/data/source-data
      HUOPAN_HISTORY_DB: /app/data/history.sqlite
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-100}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${UPLOADS_HOST_DIR:-./uploads}:/app/uploads
      - ${DATA_HOST_DIR:-./data}:/app/data
    ports:
      # 仅绑宿主机 loopback，由主服务器 nginx 反代过来；不直接对公网暴露
      - "127.0.0.1:${APP_BIND_PORT:-5180}:5174"
    expose:
      - "5174"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5174/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # 容器内 nginx：仅"独立部署"模式启用。
  # 主域名子站部署（推荐）由主服务器 nginx 接管 TLS/Basic Auth/反代，不需要这个。
  # 启用方式：docker compose --profile standalone up -d --build
  nginx:
    profiles: ["standalone"]
    image: nginx:1.27-alpine
    container_name: tuiguang-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/htpasswd:/etc/nginx/htpasswd:ro
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
