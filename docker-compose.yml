name: tuiguang

services:
  app:
    build:
      context: .
    image: tuiguang-app:latest
    container_name: tuiguang-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5174
      HOST: 0.0.0.0
      HUOPAN_UPLOAD_DIR: /app/uploads/source-data
      HUOPAN_DATA_DIR: /app/data/source-data
      HUOPAN_HISTORY_DB: /app/data/history.sqlite
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-500}
      TZ: ${TZ:-Asia/Shanghai}
      # P4.13 扩容(默认单进程/单份缓存,小内存机安全)。多核服务器再调高,
      # 注意总内存 ≈ WEB_CONCURRENCY ×(RAW_CACHE_ROW_BUDGET 对应内存 + RESULT_CACHE_MAX_MB + ~0.5G)。
      # 8 核 16G 推荐:WEB_CONCURRENCY=4,RESULT_CACHE_MAX_MB=256,并在 .env 设 NODE_OPTIONS 降单 worker 堆。
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      RAW_CACHE_ROW_BUDGET: ${RAW_CACHE_ROW_BUDGET:-1000000}
      RESULT_CACHE_MAX_MB: ${RESULT_CACHE_MAX_MB:-512}
      # 单 worker 的 V8 堆上限;集群时按 内存/worker 数 调低(默认走 Dockerfile 的 8192)
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=8192}
      # 账号系统(P4):首次部署引导首个管理员;创建后建议把密码从 .env 撤掉
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-14}
      # 功能开关(P4.1):部署初期/SMS 还没接好的时候关掉
      AUTH_OPEN_REGISTRATION: ${AUTH_OPEN_REGISTRATION:-true}
      AUTH_SMS_LOGIN: ${AUTH_SMS_LOGIN:-true}
      # SMS 验证码登录(P4.1):dev 默认;接阿里云时切到 aliyun + 4 个凭据
      SMS_PROVIDER: ${SMS_PROVIDER:-dev}
      SMS_ALIYUN_ACCESS_KEY_ID: ${SMS_ALIYUN_ACCESS_KEY_ID:-}
      SMS_ALIYUN_ACCESS_KEY_SECRET: ${SMS_ALIYUN_ACCESS_KEY_SECRET:-}
      SMS_ALIYUN_SIGN_NAME: ${SMS_ALIYUN_SIGN_NAME:-}
      SMS_ALIYUN_TEMPLATE_CODE: ${SMS_ALIYUN_TEMPLATE_CODE:-}
      SMS_ALIYUN_REGION: ${SMS_ALIYUN_REGION:-cn-hangzhou}
    volumes:
      - ${UPLOADS_HOST_DIR:-./uploads}:/app/uploads
      - ${DATA_HOST_DIR:-./data}:/app/data
    ports:
      # 仅绑宿主机 loopback，由主服务器 nginx 反代过来；不直接对公网暴露
      - "127.0.0.1:${APP_BIND_PORT:-5180}:5174"
    expose:
      - "5174"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5174/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # 容器内 nginx：仅"独立部署"模式启用,只做反代。
  # 主域名子站部署（推荐）由主服务器 nginx 接管 TLS + 反代,不需要这个。
  # 启用方式：docker compose --profile standalone up -d --build
  nginx:
    profiles: ["standalone"]
    image: nginx:1.27-alpine
    container_name: tuiguang-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
