name: tuiguang

services:
  app:
    build:
      context: .
    image: tuiguang-app:latest
    container_name: tuiguang-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5174
      HOST: 0.0.0.0
      HUOPAN_UPLOAD_DIR: /app/uploads/source-data
      HUOPAN_DATA_DIR: /app/data/source-data
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-100}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${UPLOADS_HOST_DIR:-./uploads}:/app/uploads
    expose:
      - "5174"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5174/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    image: nginx:1.27-alpine
    container_name: tuiguang-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/htpasswd:/etc/nginx/htpasswd:ro
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
